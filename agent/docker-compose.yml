services:
  nas-hub-agent:
    build: .
    container_name: nas-hub-agent
    restart: unless-stopped
    # Réseau de l'hôte : nécessaire pour retrouver les LEDs et appareils sur le réseau local.
    # L'agent écoute sur le port 8787.
    network_mode: host
    # Voir les processus de l'hôte (top RAM). Lecture seule.
    pid: host
    environment:
      AGENT_TOKEN: ""   # facultatif : mets un secret et saisis-le dans l'app
      # NET_IFACE: "eth0"   # facultatif : interface réseau à mesurer (sinon toutes les interfaces physiques)
    volumes:
      # Tout le système hôte en lecture seule : sert à détecter tous les disques et les noms des conteneurs.
      - /:/host:ro,rslave
      - ./data:/config
      # Pilotage des conteneurs (carte « Conteneurs » : arrêter, redémarrer, rebuild...).
      # Attention : donne à l'agent le contrôle total de Docker. Mets un AGENT_TOKEN.
      - /var/run/docker.sock:/var/run/docker.sock   # devices.json (écrit par l'app quand tu ajoutes des appareils)
